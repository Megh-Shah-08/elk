input {
  tcp {
    port => 5044
    codec => json
  }
}

filter {
  mutate {
    convert => {
      "cpu_usage" => "float"
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://172.18.0.2:9200"]
    user => "elastic"
    password => "${ES_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/http_ca.crt"]
    index => "cpu-monitor"
  }

  stdout {
    codec => rubydebug
  }
}
